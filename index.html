<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZMIANOLOGICA · ćwiczenia na szkoleniu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F4460;--navy-h:#163450;--honey:#E8B62C;--honey-d:#B68C20;--on-honey:#5C4810;--red:#C8202E;--bg:#F5F5F7;--info:#F0F6FB;--ink:#1B2733;--mut:#5E6B78;--line:#D5DDE5;--ok:#2E7D4F}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:4px solid var(--honey)}
.brand{display:flex;align-items:center;gap:12px}
.brand .znak{width:34px;height:auto;transform-origin:50% 50%;animation:znak-wejscie .7s cubic-bezier(.2,.8,.3,1.2) both,znak-obrot 1.2s ease-in-out 3s infinite}
.brand .napis{font-size:22px;font-weight:800;letter-spacing:.02em;color:var(--navy)}
.brand .znak{color:var(--navy)}
header #kto{font-size:13px;font-weight:600;color:var(--mut)}
@keyframes znak-wejscie{from{opacity:0;transform:translateY(-14px) scale(.7)}to{opacity:1;transform:none}}
@keyframes znak-obrot{0%{transform:rotate(0)}12%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
.brand .znak{animation-duration:.7s,9s}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:live 1.6s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.slist{width:100%;border-collapse:collapse;font-size:14.5px}
.slist td,.slist th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.slist th{font-size:12.5px;color:var(--mut);font-weight:600}
.slist button{padding:7px 12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.brand .znak,.live i{animation:none}}
main{max-width:860px;margin:0 auto;padding:20px}
h1{font-size:24px;color:var(--navy);margin:14px 0 6px}
h2{font-size:18px;color:var(--navy);margin:20px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;color:var(--navy);margin:12px 0 5px}
input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px}
input:focus{outline:none;border-color:var(--navy)}
button{font:inherit;font-weight:700;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--navy);color:#fff}
button:hover{background:var(--navy-h)}
button.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button.hon{background:var(--honey);color:var(--on-honey)}
button.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
button.wyslane,button.wyslane:disabled{background:var(--ok);color:#fff;opacity:1;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.hint{font-size:13.5px;color:var(--mut);margin:6px 0 0}
.msg{padding:10px 14px;border-radius:0 9px 9px 0;margin:12px 0;font-size:14.5px;border-left:4px solid var(--navy);background:var(--info)}
.msg.err{border-color:var(--red);background:#FBEAEA}
.msg.ok{border-color:var(--ok);background:#E7F2EA}
.q{margin-bottom:18px}
.q .t{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:500;margin-bottom:6px}
.opt:hover{background:var(--info)}
.opt.on{border-color:var(--navy);background:var(--info);font-weight:700}
.kod{font-size:40px;font-weight:800;letter-spacing:.12em;color:var(--navy)}
.big{font-size:28px;font-weight:800;color:var(--navy)}
.bar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;margin:6px 0}
.bar .l{font-size:14px}
.bar .tr{background:var(--bg);border-radius:6px;height:26px;position:relative;overflow:hidden;margin-top:3px}
.bar .f{position:absolute;inset:0 auto 0 0;background:var(--navy);border-radius:6px;transition:width .4s}
.bar.dob .f{background:var(--ok)}
.bar .n{font-weight:700;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill.o{background:#E7F2EA;color:var(--ok)}.pill.z{background:#FBEAEA;color:var(--red)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.bar .f{transition:none}}

textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:2px solid #D5DDE5;border-radius:10px;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:#1F4460}
h3{font-size:17px;color:#1F4460;margin:22px 0 8px}
.grupy{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:8px 0;cursor:pointer}
label.chk input{width:20px;height:20px;margin-top:2px;accent-color:#1F4460}
.oceny{display:flex;gap:10px}.oceny .opt{width:70px;text-align:center}
.suma{margin-top:16px;background:#FDF4DC;border-left:6px solid #E8B62C;border-radius:0 10px 10px 0;padding:10px 14px;font-size:17px}
.cwl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cwb{text-align:left;background:#fff;color:#1B2733;border:2px solid #D5DDE5;display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.cwb:hover{background:#F5F7FA;border-color:#1F4460}
.cwb small{font-weight:500;color:#5E6B78}
.cwb.wyb{border-color:#1F4460;box-shadow:0 0 0 3px #E8EEF3}
.cwb.akt{border-color:#E8B62C;background:#FDF4DC}
.por{margin:10px 0 14px}.por>span{display:block;font-weight:600;margin-bottom:6px}
.pp{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center;margin:4px 0}
.pp .tr{height:14px;background:#EEF1F4;border-radius:7px;overflow:hidden}
.pp .f{height:100%;background:#1F4460}.pp .f.szary{background:#9AA8B5}
.pp b{font-size:14px}
.grk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gk{border:2px solid #D5DDE5;border-radius:12px;padding:12px 14px;background:#fff}
.gk h3{margin-top:0}
.gp{margin:8px 0}.gp span{display:block;font-size:13px;font-weight:700;color:#5E6B78}
.wpisy{padding-left:18px;margin:6px 0}.wpisy li{margin:4px 0}
.pill.z{background:#F2F2F2;color:#5E6B78}
.obec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:#F5F7FA;border:1px solid #D5DDE5;border-radius:10px;padding:10px 14px;margin:6px 0 14px;font-size:15px}
.chip.bez{background:#FBEAEA;color:#C8202E}
.czl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#E8EEF3;color:#1F4460;border-radius:999px;padding:3px 6px 3px 12px;font-size:14px;font-weight:600}
.chip select{font:inherit;font-size:12px;border:1px solid #C9D5E1;border-radius:999px;padding:2px 4px;background:#fff;color:#1F4460}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, getDocs, serverTimestamp, writeBatch, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUVBglR2h1r-MRoMQ6F-yi5be-NW9q7VA",
  authDomain: "zmianologica-szkolenia.firebaseapp.com",
  projectId: "zmianologica-szkolenia",
  storageBucket: "zmianologica-szkolenia.firebasestorage.app",
  messagingSenderId: "518737570063",
  appId: "1:518737570063:web:454c1dd4f574fc5c5d767a"
};
const PROWADZACY = "marcin.zoltak@zmianologi.ca";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= ĆWICZENIA =================
   tryb: "ind" (każdy osobno) albo "gr" (wspólny dokument grupy)
   typy pól: wybor, liczba, tekst, dlugi, lista (pola wyboru), ocena (1–3)          */
const PYT_TESTU=[
 {id:"p1",typ:"wybor",t:"Czym różni się rekrutacja od selekcji?",o:["Rekrutacja to pozyskanie odpowiedniej liczby kandydatów, a selekcja to wybór spośród nich na podstawie zbadania kandydatów.","To dwie nazwy tego samego procesu.","Rekrutacja dotyczy stanowisk kierowniczych, a selekcja stanowisk wykonawczych."],d:0},
 {id:"p2",typ:"wybor",t:"Która z tych metod najtrafniej przewiduje późniejsze wyniki pracy kandydata?",o:["Swobodna rozmowa, w której każdy kandydat słyszy inne pytania.","Rozmowa według scenariusza, z tymi samymi pytaniami i opisami ocen dla wszystkich kandydatów.","Analiza CV i listu motywacyjnego."],d:1},
 {id:"p3",typ:"wybor",t:"Kiedy pracodawca musi przekazać kandydatowi informację o wynagrodzeniu?",o:["Dopiero przy podpisywaniu umowy.","Najpóźniej przed pierwszą rozmową, jeśli nie podał jej w ogłoszeniu.","Tylko wtedy, gdy kandydat o nią zapyta."],d:1}];
const PODEJ=["Dokładna selekcja","Sprawna rekrutacja"];
const CW=[
 {id:"test-wejsciowy",nazwa:"Test na początek",tryb:"ind",quiz:true,pola:PYT_TESTU},
 {id:"koszt",nazwa:"Koszt złego zatrudnienia",tryb:"gr",suma:true,pola:[
  {id:"h",typ:"liczba",t:"Czas właściciela na ponowną rekrutację (godziny, 100 zł za godzinę)"},
  {id:"ogl",typ:"liczba",t:"Koszt ponownego ogłoszenia (zł)"},
  {id:"wyn",typ:"liczba",t:"Wynagrodzenie wypłacone za pracę bez efektu (zł)"},
  {id:"wh",typ:"liczba",t:"Wdrożenie następcy: godziny doświadczonego pracownika"},
  {id:"ws",typ:"liczba",t:"Wdrożenie następcy: koszt godziny pracy tego pracownika (zł)"},
  {id:"pos",typ:"dlugi",t:"Koszty pośrednie, których nie da się łatwo policzyć"}]},
 {id:"podejscie",nazwa:"Które podejście w twojej firmie",tryb:"ind",pola:[
  {id:"s1",typ:"tekst",t:"Stanowisko 1"},{id:"w1",typ:"wybor",t:"Podejście do stanowiska 1",o:PODEJ},
  {id:"s2",typ:"tekst",t:"Stanowisko 2"},{id:"w2",typ:"wybor",t:"Podejście do stanowiska 2",o:PODEJ},
  {id:"s3",typ:"tekst",t:"Stanowisko 3"},{id:"w3",typ:"wybor",t:"Podejście do stanowiska 3",o:PODEJ},
  {id:"uz",typ:"dlugi",t:"Przy jednym stanowisku: co przesądziło o wyborze?"}]},
 {id:"przedzial",nazwa:"Przedział wynagrodzenia",tryb:"ind",pola:[
  {id:"st",typ:"tekst",t:"Stanowisko"},{id:"od",typ:"liczba",t:"Od (zł brutto miesięcznie)"},{id:"do",typ:"liczba",t:"Do (zł brutto miesięcznie)"},
  {id:"zr",typ:"wybor",t:"Źródło",o:["Badanie GUS","Ogólnopolskie Badanie Wynagrodzeń","Raport agencji rekrutacyjnej","Ogłoszenia z okolicy","Inne"]},
  {id:"zd",typ:"dlugi",t:"Od czego zależy, czy zaproponujesz kwotę bliżej dolnej, czy górnej granicy?"}]},
 {id:"ogloszenie",nazwa:"Popraw to ogłoszenie",tryb:"gr",pola:[
  {id:"bl",typ:"dlugi",t:"Błędy, które znaleźliście"},{id:"nowe",typ:"dlugi",t:"Poprawione ogłoszenie",duzy:true}]},
 {id:"obserwacja",nazwa:"Spotkanie w trójkach: lista obserwatora",tryb:"ind",pola:[
  {id:"lk",typ:"lista",t:"Co prowadzący zrobił?",o:["Przywitał kandydata i zaproponował miejsce.","Przedstawił siebie i firmę.","Zapowiedział przebieg i czas spotkania.","W części czerwonej mówił więcej niż kandydat.","Zapytał o pytania przed przejściem dalej.","Zadał pytania bez zmiany ich treści.","Poprosił o konkretny przykład.","Zapisywał wypowiedzi, a nie oceny."]},
  {id:"o1",typ:"ocena",t:"Ocena odpowiedzi kandydata: planowanie pracy"},
  {id:"o2",typ:"ocena",t:"Ocena odpowiedzi kandydata: rozmowa z osobą zdenerwowaną"}]},
 {id:"kandydatka",nazwa:"Co zobaczyła kandydatka",tryb:"gr",pola:[
  {id:"plus",typ:"dlugi",t:"Co budowało zaufanie"},{id:"minus",typ:"dlugi",t:"Co zniechęcało"},
  {id:"wn",typ:"dlugi",t:"Jaki wniosek o firmie mogła wyciągnąć kandydatka"},{id:"zm",typ:"dlugi",t:"Trzy zmiany bez kosztów"}]},
 {id:"kucharze",nazwa:"Trzech kucharzy",tryb:"gr",kolejnosc:true,pola:[
  {id:"m1",typ:"wybor",t:"Miejsce 1",o:["Anna","Bartek","Celina"]},{id:"m2",typ:"wybor",t:"Miejsce 2",o:["Anna","Bartek","Celina"]},{id:"m3",typ:"wybor",t:"Miejsce 3",o:["Anna","Bartek","Celina"]},
  {id:"uz",typ:"dlugi",t:"Co przesądziło o waszym wyborze?"}]},
 {id:"test-koncowy",nazwa:"Test na koniec",tryb:"ind",quiz:true,porownaj:"test-wejsciowy",pola:PYT_TESTU}];
const GRUPY=["Grupa 1","Grupa 2","Grupa 3","Grupa 4","Grupa 5","Grupa 6","Grupa 7","Grupa 8"];
const cwById = id => CW.find(c=>c.id===id);

/* ================= POMOCNICZE ================= */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const params = new URLSearchParams(location.search);
const trybProwadzacego = params.has("prowadzacy");
let odsluchy = [];
function stop(){ odsluchy.forEach(f=>f()); odsluchy=[]; }
function blad(e){
  const k = e && e.code || "";
  if(k.includes("permission-denied")) return "Serwer odmówił zapisu. Sprawdź, czy sesja jest otwarta i czy kod jest poprawny.";
  if(k.includes("unauthorized-domain")) return "Ten adres strony nie jest dopisany w Firebase do dozwolonych domen.";
  if(k.includes("popup")) return "Okno logowania zostało zamknięte albo zablokowane. Zezwól przeglądarce na wyskakujące okna i spróbuj ponownie.";
  if(k.includes("operation-not-supported") || k.includes("network")) return "Brak połączenia z serwerem albo strona jest otwarta bezpośrednio z dysku.";
  return "Wystąpił błąd: " + (e && e.message || e);
}
const liczba = v => { const n=parseFloat(String(v??"").replace(",",".").replace(/\s/g,"")); return isNaN(n)?0:n; };
const zl = n => Math.round(n).toLocaleString("pl-PL")+" zł";
function sumaKosztu(p){ p=p||{}; return liczba(p.h)*100+liczba(p.ogl)+liczba(p.wyn)+liczba(p.wh)*liczba(p.ws); }

/* ================= START ================= */
onAuthStateChanged(auth, async user => {
  stop();
  if(trybProwadzacego){
    if(user && !user.isAnonymous && user.email === PROWADZACY){ $("#kto").textContent = "Prowadzący: " + user.email; widokProwadzacyStart(); }
    else widokLogowanie(user);
  } else {
    if(!user){ try{ await signInAnonymously(auth); }catch(e){ $("#app").innerHTML = `<div class="msg err">${esc(blad(e))}</div>`; } return; }
    $("#kto").textContent = "Uczestnik";
    widokUczestnikStart();
  }
});

/* ================= UCZESTNIK ================= */
function widokUczestnikStart(komunikat){
  stop();
  const kod = params.get("s") || localStorage.getItem("zml_kod") || "";
  const nick = localStorage.getItem("zml_nick") || "";
  $("#app").innerHTML = `<h1>Dołącz do ćwiczeń</h1>
  <div class="card">
   <label for="kod">Kod sesji</label><input type="text" id="kod" value="${esc(kod)}" placeholder="podaje go prowadzący" autocomplete="off">
   <label for="nick">Pseudonim</label><input type="text" id="nick" value="${esc(nick)}" placeholder="na przykład Anna K." maxlength="30">
   <p class="hint">Nie podawaj pełnego imienia i nazwiska. Pseudonim zobaczy tylko prowadzący.</p>
   ${komunikat?`<div class="msg err">${esc(komunikat)}</div>`:""}
   <div class="row"><button id="dolacz">Dołącz</button></div></div>`;
  $("#dolacz").onclick = async () => {
    const k = $("#kod").value.trim().toUpperCase(), n = $("#nick").value.trim();
    if(!k || !n){ widokUczestnikStart("Wpisz kod sesji i pseudonim."); return; }
    try{
      const s = await getDoc(doc(db,"sesje",k));
      if(!s.exists()){ widokUczestnikStart("Nie ma sesji o tym kodzie. Sprawdź kod u prowadzącego."); return; }
      localStorage.setItem("zml_kod",k); localStorage.setItem("zml_nick",n);
      widokUczestnikSesja(k,n);
    }catch(e){ widokUczestnikStart(blad(e)); }
  };
}
function widokUczestnikSesja(kod,nick){
  stop();
  let aktywne, otwarta=true, ostPrzydz;
  const uid=auth.currentUser.uid;
  setDoc(doc(db,"sesje",kod,"odpowiedzi","obecnosc_"+uid),{uid,pseudonim:nick,cw:"obecnosc",czas:serverTimestamp()}).catch(()=>{});
  const u = onSnapshot(doc(db,"sesje",kod), s=>{
    const d=s.data(); if(!d){ widokUczestnikStart("Sesja została usunięta."); return; }
    otwarta=!!d.otwarta;
    const moj=(d.przydzial||{})[uid];
    let odnow=false;
    if(moj && moj!==ostPrzydz){ ostPrzydz=moj; const stara=localStorage.getItem("zml_grupa_"+kod); if(stara!==moj){ const ca=cwById(d.aktywne); if(stara && ca && ca.tryb==="gr") setDoc(doc(db,"sesje",kod,"grupy",ca.id+"_"+stara.replace(/\s/g,"")),{czlonkowie:{[uid]:deleteField()}},{merge:true}).catch(()=>{}); localStorage.setItem("zml_grupa_"+kod,moj); odnow=true; } }
    if((d.aktywne||null)!==aktywne){ aktywne=d.aktywne||null; odnow=true; }

    const z=$("#zamk"); if(z) z.classList.toggle("hidden",otwarta);
  });
  odsluchy.push(u);
  let wew=[];
  function pokazCwiczenie(){
    wew.forEach(f=>f()); wew=[];
    const c=cwById(aktywne);
    if(!c){ $("#app").innerHTML=`<h1>Czekamy na ćwiczenie</h1><div class="card"><p>Sesja ${esc(kod)} · ${esc(nick)}</p><p class="hint">Gdy prowadzący uruchomi ćwiczenie, pojawi się ono tutaj samo. Nie musisz odświeżać strony.</p></div>`; return; }
    if(c.tryb==="gr"){
      const g=localStorage.getItem("zml_grupa_"+kod);
      if(!g){ wyborGrupy(c); return; }
      cwGrupowe(c,g);
    } else cwIndywidualne(c);
  }
  function naglowekCw(c,dod){ return `<h1>${esc(c.nazwa)}</h1><p class="hint">Sesja ${esc(kod)} · ${esc(nick)}${dod?" · "+esc(dod):""}</p><div id="zamk" class="msg err ${otwarta?"hidden":""}">Prowadzący zamknął sesję. Odpowiedzi nie są już zapisywane.</div>`; }
  function wyborGrupy(c){
    $("#app").innerHTML = naglowekCw(c)+`<div class="card"><p>To ćwiczenie wykonujecie w grupie. Wybierz grupę o tym samym numerze co twój pokój w Teams. Nazwę pokoju widzisz na górze okna Teams.</p><div class="grupy">${GRUPY.map(g=>`<button class="sec" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div></div>`;
    document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ localStorage.setItem("zml_grupa_"+kod,b.dataset.g); cwGrupowe(c,b.dataset.g); });
  }
  function poleHTML(p,v,idx){
    const nr = idx!==undefined?`${idx+1}. `:"";
    if(p.typ==="wybor") return `<div class="q"><div class="t">${nr}${esc(p.t)}</div>${p.o.map((o,i)=>`<button class="opt ${v===i?"on":""}" data-p="${p.id}" data-v="${i}">${esc(o)}</button>`).join("")}</div>`;
    if(p.typ==="ocena") return `<div class="q"><div class="t">${nr}${esc(p.t)}</div><div class="oceny">${[1,2,3].map(i=>`<button class="opt ${v===i?"on":""}" data-p="${p.id}" data-v="${i}">${i}</button>`).join("")}</div></div>`;
    if(p.typ==="lista"){ const z=v||[]; return `<div class="q"><div class="t">${nr}${esc(p.t)}</div>${p.o.map((o,i)=>`<label class="chk"><input type="checkbox" data-l="${p.id}" data-v="${i}" ${z.includes(i)?"checked":""}> ${esc(o)}</label>`).join("")}</div>`; }
    if(p.typ==="liczba") return `<label>${nr}${esc(p.t)}</label><input type="text" inputmode="decimal" data-i="${p.id}" value="${esc(v??"")}">`;
    if(p.typ==="tekst") return `<label>${nr}${esc(p.t)}</label><input type="text" data-i="${p.id}" value="${esc(v??"")}">`;
    return `<label>${nr}${esc(p.t)}</label><textarea data-i="${p.id}" rows="${p.duzy?10:4}">${esc(v??"")}</textarea>`;
  }
  function cwIndywidualne(c){
    const uid=auth.currentUser.uid, ref=doc(db,"sesje",kod,"odpowiedzi",c.id+"_"+uid);
    let odp={}, wyslane=false;
    const rys=()=>{
      const pelne = c.quiz ? c.pola.every(p=>odp[p.id]!==undefined) : true;
      $("#app").innerHTML = naglowekCw(c)+`<div class="card">${c.pola.map((p,i)=>poleHTML(p,odp[p.id],c.quiz?i:undefined)).join("")}
       <div class="row"><button id="wyslij" class="${wyslane?"wyslane":""}" ${!pelne||wyslane?"disabled":""}>${wyslane?"Twoje dane zostały wysłane":"Wyślij odpowiedzi"}</button></div>
       <p class="hint">Odpowiedzi możesz zmieniać i wysyłać ponownie, dopóki prowadzący nie zamknie sesji.</p></div>`;
      document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ odp[b.dataset.p]=Number(b.dataset.v); wyslane=false; rys(); });
      document.querySelectorAll("[data-l]").forEach(b=>b.onchange=()=>{ const a=new Set(odp[b.dataset.l]||[]); b.checked?a.add(Number(b.dataset.v)):a.delete(Number(b.dataset.v)); odp[b.dataset.l]=[...a].sort(); if(wyslane){wyslane=false;const w=$("#wyslij");w.className="";w.disabled=false;w.textContent="Wyślij odpowiedzi";} });
      document.querySelectorAll("[data-i]").forEach(b=>b.oninput=()=>{ odp[b.dataset.i]=b.value; if(wyslane){wyslane=false;const w=$("#wyslij");w.className="";w.disabled=false;w.textContent="Wyślij odpowiedzi";} });
      $("#wyslij").onclick=async()=>{ const b=$("#wyslij"); b.disabled=true; b.textContent="Wysyłanie…";
        try{ await setDoc(ref,{uid,pseudonim:nick,cw:c.id,odp,czas:serverTimestamp()}); wyslane=true; rys(); }
        catch(e){ b.disabled=false; b.textContent="Wyślij odpowiedzi"; $("#app").insertAdjacentHTML("beforeend",`<div class="msg err">${esc(blad(e))}</div>`); } };
    };
    getDoc(ref).then(d=>{ if(d.exists()){ odp=d.data().odp||{}; } rys(); }).catch(()=>rys());
  }
  function cwGrupowe(c,g){
    const ref=doc(db,"sesje",kod,"grupy",c.id+"_"+g.replace(/\s/g,""));
    let pola={}, pierwszy=true, timery={};
    $("#app").innerHTML = naglowekCw(c,g)+`<div class="card"><p class="hint">Wszystkie osoby z twojej grupy widzą i zmieniają ten sam formularz. Zmiany zapisują się same po chwili. Najwygodniej, gdy wpisuje jedna osoba, a pozostałe czytają i poprawiają.</p><p class="hint">Osoby w grupie: <b id="czl"></b></p>
     <div id="formg"></div>${c.suma?`<div class="suma">Koszt policzalny razem: <b id="sumab">0 zł</b></div>`:""}
     <div class="row"><span id="stan" class="hint"></span><button class="sec" id="zmg">Zmień grupę</button></div></div>`;
    setDoc(ref,{cw:c.id,grupa:g,czlonkowie:{[uid]:nick}},{merge:true}).catch(()=>{});
    $("#zmg").onclick=()=>{ setDoc(ref,{czlonkowie:{[uid]:deleteField()}},{merge:true}).catch(()=>{}); localStorage.removeItem("zml_grupa_"+kod); wew.forEach(f=>f()); wew=[]; wyborGrupy(c); };
    const rys=()=>{ $("#formg").innerHTML=c.pola.map(p=>poleHTML(p,pola[p.id])).join(""); podepnij(); if(c.suma) $("#sumab").textContent=zl(sumaKosztu(pola)); };
    const zapisz=(k,v)=>{ pola[k]=v; if(c.suma) $("#sumab").textContent=zl(sumaKosztu(pola)); $("#stan").textContent="Zapisywanie…";
      clearTimeout(timery[k]); timery[k]=setTimeout(async()=>{ try{ await setDoc(ref,{cw:c.id,grupa:g,pola:{[k]:v},czas:serverTimestamp()},{merge:true}); $("#stan").textContent="Zapisano"; }catch(e){ $("#stan").textContent=blad(e); } }, v===undefined||typeof v==="number"?0:700); };
    function podepnij(){
      document.querySelectorAll("#formg .opt").forEach(b=>b.onclick=()=>{ zapisz(b.dataset.p,Number(b.dataset.v)); rys(); });
      document.querySelectorAll("#formg [data-i]").forEach(b=>b.oninput=()=>zapisz(b.dataset.i,b.value));
    }
    const u=onSnapshot(ref,s=>{
      const cz=$("#czl"); if(cz) cz.textContent=Object.values((s.data()||{}).czlonkowie||{}).join(", ");
      const zdalne=(s.data()||{}).pola||{};
      if(pierwszy){ pola={...zdalne}; pierwszy=false; rys(); return; }
      const akt=document.activeElement;
      Object.entries(zdalne).forEach(([k,v])=>{
        if(akt && akt.dataset && akt.dataset.i===k) return;
        pola[k]=v;
        const el=document.querySelector(`#formg [data-i="${k}"]`);
        if(el){ if(el.value!==v) el.value=v; }
        else document.querySelectorAll(`#formg .opt[data-p="${k}"]`).forEach(b=>b.classList.toggle("on",Number(b.dataset.v)===v));
      });
      if(c.suma) $("#sumab").textContent=zl(sumaKosztu(pola));
    });
    wew.push(u); odsluchy.push(u);
  }
}

  stop();

   <p>Zaloguj się kontem Google prowadzącego.</p>
   ${inny?`<div class="msg err">Zalogowano kontem ${esc(user.email)}, które nie ma uprawnień prowadzącego.</div>`:""}
   <div class="row"><button id="log">Zaloguj się kontem Google</button>${inny?`<button class="sec" id="wyl">Wyloguj</button>`:""}</div><div id="e"></div></div>`;

}
function nowyKod(){ const z="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let k=""; for(let i=0;i<5;i++) k+=z[Math.floor(Math.random()*z.length)]; return k; }
function widokProwadzacyStart(komunikat){
  stop();
  $("#app").innerHTML = `<h1>Sesje szkoleniowe</h1>
  <div class="card"><h2 style="margin-top:0">Nowa sesja</h2>
   <label for="nazwa">Nazwa sesji</label><input type="text" id="nazwa" placeholder="na przykład Rekrutacja i selekcja, grupa jesienna">
   <div class="row"><button id="utworz">Utwórz sesję</button></div></div>
  <div class="card"><h2 style="margin-top:0">Twoje sesje</h2><div id="lista"><p class="hint">Wczytywanie…</p></div></div>
  ${komunikat?`<div class="msg err">${esc(komunikat)}</div>`:""}
  <div class="row"><button class="sec" id="wyl">Wyloguj</button></div>`;
  $("#utworz").onclick = async () => {
    const k = nowyKod();
    try{ await setDoc(doc(db,"sesje",k),{nazwa:$("#nazwa").value.trim()||"Sesja "+k, otwarta:true, aktywne:null, utworzona:serverTimestamp()}); widokSesja(k); }
    catch(e){ widokProwadzacyStart(blad(e)); }
  };
  $("#wyl").onclick = () => signOut(auth);
  wczytajListe();
}
async function wczytajListe(){
  try{
    const s = await getDocs(collection(db,"sesje"));
    const L = [];
    for(const d of s.docs){ const o = await getDocs(collection(db,"sesje",d.id,"odpowiedzi")); const g = await getDocs(collection(db,"sesje",d.id,"grupy")); L.push({kod:d.id, ...d.data(), n:o.docs.filter(x=>x.id.startsWith("obecnosc_")).length}); }
    L.sort((a,b)=>(b.utworzona?.seconds||0)-(a.utworzona?.seconds||0));
    const dt = t => t ? new Date(t.seconds*1000).toLocaleString("pl-PL",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : "";
    $("#lista").innerHTML = L.length ? `<table class="slist"><tr><th>Kod</th><th>Nazwa</th><th>Utworzona</th><th>Uczestnicy</th><th>Stan</th><th></th></tr>
     ${L.map(x=>`<tr><td><b>${esc(x.kod)}</b></td><td>${esc(x.nazwa)}</td><td>${esc(dt(x.utworzona))}</td><td>${x.n}</td>
      <td><span class="pill ${x.otwarta?"o":"z"}">${x.otwarta?"otwarta":"zamknięta"}</span></td>
      <td style="white-space:nowrap"><button class="sec" data-o="${esc(x.kod)}">Otwórz</button> <button class="red" data-u="${esc(x.kod)}">Usuń</button></td></tr>`).join("")}</table>`
     : `<p class="hint">Nie masz jeszcze żadnej sesji.</p>`;
    document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>widokSesja(b.dataset.o));
    document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{ if(await usunSesje(b.dataset.u)) wczytajListe(); });
  }catch(e){ $("#lista").innerHTML = `<div class="msg err">${esc(blad(e))}</div>`; }
}
async function usunSesje(kod){
  if(!confirm("Usunąć wszystkie odpowiedzi i samą sesję "+kod+"? Tej operacji nie da się cofnąć.")) return false;
  for(const kol of ["odpowiedzi","grupy"]){ const s = await getDocs(collection(db,"sesje",kod,kol)); const b = writeBatch(db); s.forEach(d=>b.delete(d.ref)); await b.commit(); }
  await deleteDoc(doc(db,"sesje",kod)); return true;
}

     <div class="row">${sesja.aktywne===wybrane?`<button class="sec" id="zatrz">Zatrzymaj ćwiczenie u uczestników</button>`:`<button class="hon" id="uruch">Pokaż uczestnikom: ${esc(c.nazwa)}</button>`}</div></div>
    <div class="card"><div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">${esc(c.nazwa)}</h2>
      <p style="margin:0"><span class="live"><i></i>na żywo</span> <span class="hint">${tmax?"· ostatni wpis o "+new Date(tmax*1000).toLocaleTimeString("pl-PL"):""}</span></p></div>
     ${c.quiz?`<div class="row"><button class="hon" id="pok">${pokaz?"Ukryj poprawne odpowiedzi":"Pokaż poprawne odpowiedzi"}</button></div>`:""}
     <div id="wyniki">${wyniki(c)}</div></div>`;
    $("#kopiuj").onclick=()=>navigator.clipboard.writeText(link);
    $("#przelacz").onclick=()=>updateDoc(doc(db,"sesje",kod),{otwarta:!sesja.otwarta});
    $("#wroc").onclick=()=>widokProwadzacyStart();

    document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ wybrane=b.dataset.c; pokaz=false; rys(); });

  function pasek(l,c,n,dob){ return `<div class="bar ${dob?"dob":""}"><div><div class="l">${esc(l)}</div><div class="tr"><div class="f" style="width:${n?Math.round(c/n*100):0}%"></div></div></div><div class="n">${c}</div></div>`; }
  function wyniki(c){

      const pierwsi={}; w.forEach(x=>{ const m=(x.pola||{}).m1; if(m!==undefined){ const k=c.pola[0].o[m]; pierwsi[k]=(pierwsi[k]||0)+1; } });
      return lin+`<table class="slist"><tr><th>Grupa</th><th>Miejsce 1</th><th>Miejsce 2</th><th>Miejsce 3</th><th>Uzasadnienie</th></tr>${w.map(x=>{const p=x.pola||{};const nm=k=>p[k]!==undefined?c.pola[0].o[p[k]]:"—";return `<tr><td><b>${esc(x.grupa)}</b></td><td>${nm("m1")}</td><td>${nm("m2")}</td><td>${nm("m3")}</td><td>${esc(p.uz||"")}</td></tr>`}).join("")}</table>
       <p class="hint">Na pierwszym miejscu: ${Object.entries(pierwsi).map(([k,v])=>esc(k)+" "+v).join(", ")||"brak"}. Kolejność względem profilu: Anna, Celina, Bartek.</p>`;
    }
    return lin+`<div class="grk">${w.map(x=>{ const p=x.pola||{};
      const czl=Object.entries(x.czlonkowie||{});
      return `<div class="gk"><h3>${esc(x.grupa)} <small class="hint">· ${czl.length} os.</small></h3><div class="czl">${czl.map(([u,n])=>`<span class="chip">${esc(n)}<select data-mv="${esc(u)}" data-n="${esc(n)}" data-z="${esc(x.grupa)}" title="Przenieś do innej grupy"><option value="">przenieś</option>${GRUPY.filter(g=>g!==x.grupa).map(g=>`<option>${g}</option>`).join("")}</select></span>`).join("")||`<span class="hint">nikt nie jest teraz w tej grupie</span>`}</div>${c.suma?`<div class="suma">Razem: <b>${zl(sumaKosztu(p))}</b></div>`:""}${c.pola.map(q=>{ const v=p[q.id];
        if(v===undefined||v==="") return "";
        const tekst = q.typ==="wybor"?q.o[v]:(q.typ==="liczba"?v:String(v));
        return `<div class="gp"><span>${esc(q.t)}</span><div>${esc(tekst).replace(/\n/g,"<br>")}</div></div>`}).join("")}</div>`}).join("")}</div>`;
  }
  odsluchy.push(onSnapshot(doc(db,"sesje",kod), s=>{ sesja=s.data(); if(sesja) rys(); }));
  odsluchy.push(onSnapshot(collection(db,"sesje",kod,"odpowiedzi"), s=>{ ind=s.docs.map(d=>d.data()); rys(); }));
  odsluchy.push(onSnapshot(collection(db,"sesje",kod,"grupy"), s=>{ gr=s.docs.map(d=>d.data()); rys(); }));
}
</script>
</body>
