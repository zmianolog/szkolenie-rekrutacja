<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROFILENS · Rekrutacja w małej firmie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F4460;--navy-h:#163450;--honey:#E8B62C;--honey-h:#B68C20;--on-honey:#5C4810;--red:#C8202E;
--bg:#F5F5F7;--info:#F0F6FB;--ink:#24282D;--mut:#5E656D;--line:#D9DCE1;--ok:#2E6B45;--okb:#E7F2EA;--warnb:#FDF4DC}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40}
.hdr{max-width:1080px;margin:0 auto;padding:12px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.04em;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:11px;letter-spacing:.02em;color:#B9C8D6}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.step{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.09);color:#C9D5E1;cursor:pointer;border:none;font-family:inherit}
.step.on{background:var(--honey);color:var(--on-honey)}.step.done{color:var(--honey)}
.step:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.tools{display:flex;gap:6px}
.tools button,.tools label{font-family:inherit;font-size:12px;font-weight:600;background:transparent;color:#DCE5EE;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 10px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:8px 22px 90px}
h1{font-size:28px;font-weight:800;color:var(--navy);margin:28px 0 6px;line-height:1.25}
h2{font-size:19px;font-weight:700;color:var(--navy);margin:26px 0 10px}
h3{font-size:16px;font-weight:700;color:var(--navy);margin:0 0 6px}
.lead{color:var(--mut);max-width:760px;margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px}
.info{background:var(--info);border-left:4px solid var(--navy);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14.5px;max-width:860px}
.warn{background:var(--warnb);border-left:4px solid var(--honey);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14.5px}
.alarm{background:#FBEAEA;border-left:4px solid var(--red);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14.5px}
label.f{display:block;font-weight:600;font-size:14px;color:var(--navy);margin:14px 0 5px}
.hint{font-size:13.5px;color:var(--mut);margin:4px 0 0}
input[type=text],input[type=number],textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--navy);outline:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input{flex:1}
.x{font-family:inherit;border:1.5px solid var(--line);background:#fff;border-radius:8px;width:38px;height:40px;cursor:pointer;color:var(--mut);font-size:18px}
.btn{font-family:inherit;font-size:14.5px;font-weight:700;border:none;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-h)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.hon{background:var(--honey);color:var(--on-honey)}.btn.hon:hover{background:var(--honey-h);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.q{display:grid;grid-template-columns:1fr 390px;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;margin-bottom:8px}
.q.set{border-color:#9DB0C2}
.q .t{font-size:14.8px;font-weight:500;line-height:1.4}
.sc{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.sc.two{grid-template-columns:repeat(2,1fr)}.sc.five{grid-template-columns:repeat(5,1fr)}.sc.five button{font-size:12px}
.sc button{font-family:inherit;font-size:13px;font-weight:600;padding:9px 2px;border:none;border-right:1.5px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.sc button:last-child{border-right:none}.sc button.on{background:var(--navy);color:#fff}
@media(max-width:760px){.q{grid-template-columns:1fr}}
.grp{margin:18px 0 8px;font-weight:700;color:var(--navy);font-size:15px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.pick{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.opt b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
.opt span{font-size:13.5px;color:var(--mut)}
.opt.on{border-color:var(--navy);background:var(--info)}
.opt.two{border-color:var(--honey);background:#FFFBEF}
.res{border-left:5px solid var(--honey);background:#fff;border-radius:0 12px 12px 0;padding:16px 20px;margin-bottom:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.res .k{font-size:13px;color:var(--mut);font-weight:600}
.res .v{font-size:19px;font-weight:800;color:var(--navy);margin:2px 0 4px}
.crit{display:grid;grid-template-columns:30px 1fr 230px;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit.off .nm{color:var(--mut)}
.crit .nm{font-weight:700;color:var(--navy)}
.crit .why{font-size:13.5px;color:var(--mut)}
.crit .tg{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px}
.crit input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--navy)}
@media(max-width:760px){.crit{grid-template-columns:30px 1fr}.crit .tg{grid-column:2}}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:1px}
.p1{background:#FBEAEA;color:var(--red)}.p2{background:var(--warnb);color:var(--on-honey)}.p3{background:var(--info);color:var(--navy)}
.stage{display:grid;grid-template-columns:54px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:none}
.stage .n{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.stage h3{margin-bottom:2px}.stage .tm{font-size:13px;color:var(--honey-h);font-weight:700}
.stage p{margin:6px 0 0;font-size:14.5px}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.tot div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px}
.tot b{display:block;font-size:24px;color:var(--navy)}.tot span{font-size:13px;color:var(--mut)}
.trial{border:1.5px solid var(--line);border-radius:12px;padding:18px;background:#fff;margin-bottom:14px}
.trial .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex{font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:6px}
.ex b{color:var(--navy)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;margin:4px 0}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--navy)}
.anch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:760px){.anch{grid-template-columns:1fr}}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.cmp th{background:var(--info);color:var(--navy);font-size:13px}
.scwrap{overflow-x:auto}
.mini{display:inline-grid;grid-template-columns:repeat(3,32px);border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.mini button{font-family:inherit;border:none;border-right:1px solid var(--line);background:#fff;padding:4px 0;cursor:pointer;font-weight:700;color:var(--mut)}
.mini button:last-child{border-right:none}.mini button.on{background:var(--navy);color:#fff}
.rank{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.rank .pos{font-size:22px;font-weight:800;color:var(--navy);min-width:30px}
.rank.out{opacity:.6}
.tool{padding:12px 0;border-bottom:1px solid var(--line)}.tool:last-child{border-bottom:none}
.tool .nm{font-weight:700;color:var(--navy);margin-bottom:6px}
.tpick{display:flex;flex-wrap:wrap;gap:8px}
.topt{font-family:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;color:var(--ink);font-size:14px}
.topt .rk{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.topt.on{border-color:var(--navy);background:var(--info)}
.hint.psy{color:var(--honey-h)}
.anb{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.anb .nm{font-weight:700;color:var(--navy)}
.hidden{display:none!important}
#druk{display:none}
@media print{
 body{background:#fff;font-size:10.5pt}
 header,main{display:none!important}
 #druk{display:block}
 @page{size:A4;margin:16mm 15mm}
}
#druk h1{font-size:17pt;margin:0 0 4pt;color:var(--navy)}
#druk h2{font-size:12.5pt;margin:14pt 0 5pt;color:var(--navy);border-bottom:1.5pt solid var(--honey);padding-bottom:2pt}
#druk h3{font-size:11pt;margin:10pt 0 3pt}
#druk p{margin:3pt 0}
#druk .sub{color:#555;margin-bottom:8pt}
#druk .cr{page-break-inside:avoid;border:1pt solid #bbb;border-radius:4pt;padding:7pt 9pt;margin:7pt 0}
#druk .notes{border:1pt dashed #999;height:52pt;margin:5pt 0;border-radius:3pt}
#druk .notes.big{height:120pt}
#druk .box{display:inline-block;border:1pt solid #333;width:18pt;height:16pt;text-align:center;margin-right:4pt;font-weight:700;line-height:16pt}
#druk .a{font-size:9.5pt;margin:2pt 0}
#druk table{width:100%;border-collapse:collapse;font-size:9.5pt}
#druk th,#druk td{border:1pt solid #999;padding:3pt 5pt;text-align:left;vertical-align:top}
#druk .pb{page-break-before:always}
#druk .ft{margin-top:14pt;font-size:8pt;color:#777}
</style>
</head>

const BANK=[{"czesc": "NAPĘD", "opis": "Kryteria z obszaru napędu opisują, czego kandydat chce od pracy: co go w niej pociąga, jakie potrzeby praca ma zaspokajać i skąd bierze się jego zaangażowanie. Te kryteria nie mówią, czy kandydat jest dobry, tylko czy to, czego chce, zgadza się z tym, co daje stanowisko. Dlatego przy większości z nich ocena nie jest wynikiem, tylko opisem, który porównuje się z tym, co oferuje rola.", "items": [{"kod": "N1.1", "ps": "Wyobraźmy sobie wolny tydzień bez żadnych obowiązków. Czym z tej dziedziny chciałoby się wtedy zająć i dlaczego?", "nazwa": "Zainteresowanie treścią pracy", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydata pociąga sam materiał, z którym będzie pracował, na przykład gotowanie, programowanie albo obsługa maszyn, a nie wyłącznie wynagrodzenie, godziny pracy czy dojazd. Ma ono znaczenie wtedy, gdy praca wymaga ciągłego uczenia się albo gdy rytm pracy jest nieregularny, ponieważ w takich warunkach osobę, której dziedzina nie interesuje, trudno utrzymać w pracy samą nagrodą.", "p1": "Proszę opowiedzieć, które zajęcie w ostatniej pracy albo w nauce było najbardziej interesujące i co konkretnie w nim ciekawiło.", "p2": "Proszę opowiedzieć o ostatniej sytuacji, w której poświęcono czas na poznanie czegoś z tej dziedziny, choć nikt tego nie wymagał. Co to było i skąd wziął się ten wybór?", "pd": "Co w pracy na tym stanowisku byłoby najmniej interesujące?", "o1": "Kandydat mówi o pracy przede wszystkim przez wynagrodzenie, warunki albo lokalizację. O samym materiale pracy wypowiada się ogólnie i nie potrafi podać przykładu, w którym zajmował się dziedziną z własnej woli.", "o2": "Kandydat wskazuje konkretne części pracy, które go interesują, ale jego przykłady dotyczą wyłącznie tego, czego wymagało od niego stanowisko. Nie podaje przykładów zajmowania się dziedziną poza obowiązkiem.", "o3": "Kandydat podaje konkretne przykłady zajmowania się dziedziną z własnej inicjatywy, na przykład czytania, próbowania nowych rozwiązań albo nauki poza obowiązkiem, i potrafi szczegółowo opisać, co go w tej dziedzinie pociąga."}, {"kod": "N1.2", "ps": "Wyobraźmy sobie, że przełożony wyznaczył cel, który łatwo osiągnąć. Co zostanie zrobione z pozostałym czasem i możliwościami?", "nazwa": "Potrzeba osiągnięć", "rodzaj": "dopasowanie", "co": "To kryterium sprawdza, jak silnie kandydata napędza mierzalny wynik i doskonalenie się w tym, co robi. Silna potrzeba osiągnięć jest korzystna w roli, która daje jasne cele i widoczny wynik, natomiast w roli powtarzalnej, bez możliwości poprawiania wyniku, ta sama potrzeba prowadzi do znużenia i odejścia.", "p1": "Proszę opowiedzieć o wyniku w pracy, który daje największą satysfakcję. Jaki to był wynik i w jaki sposób został zmierzony?", "p2": "Proszę opisać sytuację, w której postawiono sobie cel wyższy, niż wymagał przełożony. Co to był za cel i co z niego wyszło?", "pd": "Po czym było wiadomo, że to był dobry wynik?", "o1": "Oznacza słabą potrzebę osiągnięć. Kandydat opisuje satysfakcję z pracy przez atmosferę, uznanie albo spokój, nie podaje przykładu samodzielnie podniesionego celu, a wynik opisuje ogólnie, bez miary.", "o2": "Oznacza umiarkowaną potrzebę osiągnięć. Kandydat podaje mierzalny wynik, ale cele przyjmował od przełożonego, a cel wyższy od wymaganego pojawia się w jego opowieści jako wyjątek.", "o3": "Oznacza silną potrzebę osiągnięć. Kandydat podaje kilka przykładów celów, które wyznaczył sobie sam i które dało się zmierzyć, porównuje swoje wyniki z wcześniejszymi i mówi o tym, co zrobił, żeby je poprawić."}, {"kod": "N1.3", "ps": "Wyobraźmy sobie, że zespół przyjmuje sposób pracy, który wydaje się gorszy od znanego rozwiązania. Co zostanie zrobione?", "nazwa": "Potrzeba wpływu", "rodzaj": "dopasowanie", "co": "To kryterium sprawdza, jak silnie kandydata napędza możliwość oddziaływania na innych i decydowania. Silna potrzeba wpływu jest korzystna w roli kierowniczej albo w roli, która przekonuje klientów, natomiast na stanowisku wykonawczym, bez realnego wpływu na decyzje, ta sama potrzeba prowadzi do frustracji i konfliktów z przełożonym.", "p1": "Proszę opowiedzieć o sytuacji, w której udało się przekonać innych do własnego rozwiązania albo zmienić sposób działania zespołu.", "p2": "Proszę opisać sytuację, w której decyzję podjął ktoś inny, choć było własne zdanie w tej sprawie. Co wtedy zostało zrobione?", "pd": "Co w tej sytuacji dawało największą satysfakcję?", "o1": "Oznacza słabą potrzebę wpływu. Kandydat przyjmuje decyzje innych bez prób ich zmiany, a satysfakcję z pracy czerpie ze źródeł niezwiązanych z decydowaniem.", "o2": "Oznacza umiarkowaną potrzebę wpływu. Kandydat próbuje wpływać na decyzje wtedy, gdy dotyczą one jego własnej pracy, ale nie szuka wpływu poza tym zakresem.", "o3": "Oznacza silną potrzebę wpływu. Kandydat podaje wiele przykładów dążenia do decydowania, satysfakcję opisuje przez to, że inni przyjęli jego kierunek, a sytuacje bez wpływu opisuje jako uciążliwe."}, {"kod": "N1.4", "ps": "Wyobraźmy sobie dwie oferty pracy: jedną w stałym, zgranym zespole, drugą samodzielną i lepiej płatną. Co przesądzi o wyborze?", "nazwa": "Potrzeba afiliacji", "rodzaj": "dopasowanie", "co": "To kryterium sprawdza, jak silnie kandydata napędza przynależność do zespołu i bliskie relacje w pracy. Silna potrzeba afiliacji jest korzystna w pracy opartej na stałym zespole, natomiast na stanowisku, na którym pracuje się w pojedynkę albo w rywalizacji, ta sama potrzeba pozostaje niezaspokojona i obniża zadowolenie z pracy.", "p1": "Proszę opowiedzieć o zespole, w którym pracowało się najlepiej, i o tym, co decydowało, że było dobrze.", "p2": "Proszę opisać okres, w którym pracowało się w pojedynkę albo z niewielką liczbą kontaktów z ludźmi. Jak ten czas był odbierany?", "pd": "Czego brakowało w pracy, która była najmniej lubiana?", "o1": "Oznacza słabą potrzebę afiliacji. Kandydat dobrze ocenia pracę samodzielną, a relacje ze współpracownikami nie pojawiają się w jego odpowiedziach jako źródło zadowolenia.", "o2": "Oznacza umiarkowaną potrzebę afiliacji. Kandydat ceni dobre relacje w zespole, ale traktuje je jako dodatek do pracy, a okresy pracy w pojedynkę opisuje bez skarg.", "o3": "Oznacza silną potrzebę afiliacji. Kandydat wskazuje relacje jako główny powód zadowolenia z pracy, pracę w izolacji opisuje jako trudną, a swoje wybory zawodowe tłumaczy ludźmi, z którymi pracował."}, {"kod": "N2.1", "ps": "Wyobraźmy sobie zadanie, którego nikt nie będzie sprawdzał ani nagradzał. Jak zostanie wykonane i dlaczego?", "nazwa": "Źródło zaangażowania", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy zaangażowanie kandydata płynie z samej pracy, czy głównie z nagrody, oceny i kontroli z zewnątrz. Ma ono znaczenie wtedy, gdy praca jest mało nadzorowana albo powtarzalna, ponieważ osoba zaangażowana wyłącznie przez nagrodę i kontrolę obniża jakość pracy, gdy kontrola słabnie.", "p1": "Proszę opowiedzieć o okresie, w którym praca szła wyjątkowo dobrze. Co wtedy powodowało, że chciało się ją wykonywać?", "p2": "Proszę opisać sytuację, w której zadanie zostało wykonane starannie, choć nikt tego nie sprawdzał i nie nagradzał.", "pd": "Co zdecydowało o odejściu z poprzedniej pracy albo o tym, że rozważana jest zmiana?", "o1": "Kandydat opisuje swoje zaangażowanie przez premię, ocenę przełożonego, kontrolę albo obawę przed konsekwencjami i nie podaje przykładu starannej pracy wykonanej bez nadzoru.", "o2": "Kandydat wymienia zarówno nagrodę i ocenę, jak i samą pracę jako źródła zaangażowania, a przykład starannej pracy bez nadzoru podaje dopiero po dopytaniu.", "o3": "Kandydat opisuje swoje zaangażowanie przez samą pracę i jej jakość, podaje konkretny przykład starannej pracy wykonanej bez nadzoru i nagrody, a o nagrodzie mówi jako o sprawie drugorzędnej."}, {"kod": "N2.2", "nazwa": "Wyrazistość napędu", "rodzaj": "flaga", "co": "To kryterium nie ma osobnych pytań, ponieważ ocenia się je na podstawie odpowiedzi na wszystkie pytania z obszaru napędu. Sprawdza ono, czy z tych odpowiedzi wyłania się spójny obraz tego, czego kandydat chce od pracy. Niska ocena nie jest powodem odrzucenia kandydata, tylko sygnałem, że jego napęd trzeba sprawdzić w inny sposób, na przykład w rozmowie z poprzednim pracodawcą albo w okresie próbnym.", "o1": "Napęd jest rozmyty. Kandydat nie potrafi wskazać, co pociąga go w pracy, jego odpowiedzi są ogólne i deklaratywne, a w kolejnych pytaniach wskazuje różne, niezwiązane ze sobą powody.", "o2": "Napęd jest częściowo wyraźny. Kandydat wskazuje jedną lub dwie potrzeby, ale tylko część jego odpowiedzi potwierdza je konkretnymi przykładami.", "o3": "Napęd jest wyraźny. Z odpowiedzi wyłania się jedna lub dwie dominujące potrzeby, które kandydat potwierdza w kilku niezależnych przykładach."}]}, {"czesc": "RELACJE", "opis": "Kryteria z obszaru relacji opisują, jak kandydat pracuje z drugim człowiekiem: ze współpracownikiem, z podwładnym, z klientem, ze stroną sporu i z grupą. Pięć pierwszych kryteriów to układy z ludźmi, które występują w roli z różną częstością, a trzy kolejne opisują sposób, w jaki kandydat zachowuje się wobec ludzi niezależnie od układu.", "items": [{"kod": "R1.1", "ps": "Wyobraźmy sobie, że osoba z sąsiedniego stanowiska potrzebuje wyników pracy wcześniej, niż da się je przygotować, a nikt nie może rozstrzygnąć za was. Co zostanie zrobione?", "nazwa": "Koordynacja", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi uzgodnić pracę z osobą równorzędną, gdy żadna ze stron nie może drugiej wydać polecenia. Ma ono znaczenie wszędzie tam, gdzie wynik zależy od kilku osób, na przykład między kuchnią a salą albo między programistą a osobą testującą.", "p1": "Proszę opowiedzieć o sytuacji, w której trzeba było uzgodnić pracę z osobą z innego działu albo z równorzędnym współpracownikiem, a każda ze stron miała inne potrzeby.", "p2": "Proszę opisać sytuację, w której praca stanęła, ponieważ ktoś inny nie dostarczył tego, co było potrzebne. Co zostało zrobione?", "pd": "Jakie ustalenie z tej rozmowy wynikło i czy zostało dotrzymane?", "o1": "Kandydat czeka, aż sprawę rozstrzygnie ktoś inny, przekazuje ją przełożonemu albo próbuje narzucić swoje rozwiązanie. Z jego opowieści nie wynika żadne konkretne ustalenie.", "o2": "Kandydat doprowadza do ustalenia w sytuacji typowej, w której obie strony są chętne do współpracy, ale przy sprzecznych potrzebach sprawa trafia do przełożonego.", "o3": "Kandydat doprowadza do ustalenia także przy sprzecznych potrzebach stron, uzgadnia termin i sposób informowania się nawzajem, a potem sprawdza, czy ustalenie zostało dotrzymane."}, {"kod": "R1.2", "ps": "Wyobraźmy sobie pracownika, który drugi raz nie dotrzymał ustalonego terminu. Jak będzie wyglądała rozmowa z nim?", "nazwa": "Kierowanie", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi rozdzielić pracę między ludzi, przekazać im informację zwrotną o ich pracy i wyegzekwować to, co zostało ustalone. Ma ono znaczenie w każdej roli, w której ktoś odpowiada za pracę innych osób, także wtedy, gdy wdraża nowego pracownika.", "p1": "Proszę opowiedzieć o sytuacji, w której trzeba było rozdzielić pracę między kilka osób przy ograniczonym czasie. Jak zapadły decyzje, kto co robi?", "p2": "Proszę opisać rozmowę z pracownikiem, który nie wykonał tego, co zostało ustalone. Co zostało powiedziane i co działo się potem?", "pd": "Po czym było widać, że ta rozmowa przyniosła skutek?", "o1": "Kandydat wykonuje pracę sam zamiast ją rozdzielać albo unika trudnych rozmów, a jego informacja zwrotna jest ogólna i nie prowadzi do egzekwowania ustaleń.", "o2": "Kandydat rozdziela pracę i przekazuje informację zwrotną w sytuacjach typowych, ale gdy pracownik stawia opór, nie wraca do sprawy albo robi to niekonsekwentnie.", "o3": "Kandydat rozdziela pracę z uwzględnieniem możliwości poszczególnych osób, w informacji zwrotnej nazywa konkretne zachowanie, jego skutek i oczekiwanie na przyszłość, a do ustaleń wraca i wyciąga konsekwencje także wtedy, gdy pracownik stawia opór."}, {"kod": "R1.3", "ps": "Wyobraźmy sobie klienta, który chce rozwiązania droższego i gorszego dla niego niż to, które da się zaproponować. Jak będzie wyglądała rozmowa?", "nazwa": "Wpływ bez władzy", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi doprowadzić do decyzji osobę, która mu nie podlega, czyli klienta, przełożonego albo inną osobę decydującą. Ma ono znaczenie w sprzedaży, w obsłudze klienta i w każdej roli, w której trzeba uzyskać zgodę osoby stojącej wyżej.", "p1": "Proszę opowiedzieć o sytuacji, w której trzeba było przekonać klienta, przełożonego albo inną osobę decydującą do rozwiązania, na które początkowo się nie zgadzała.", "p2": "Proszę opisać sytuację, w której nie udało się przekonać osoby decydującej. Co zostało zrobione i jaki wniosek z tego wynikł?", "pd": "Jakie argumenty zostały użyte i skąd było wiadomo, że będą ważne dla tej osoby?", "o1": "Kandydat argumentuje wyłącznie ze swojej perspektywy, powtarza te same argumenty albo szybko ustępuje i nie próbuje ustalić, czego potrzebuje druga strona.", "o2": "Kandydat przygotowuje argumenty i dopasowuje je do rozmówcy w sytuacji typowej, ale przy odmowie nie proponuje innego rozwiązania.", "o3": "Kandydat ustala, czym kieruje się osoba decydująca, buduje propozycję pod jej kryteria, a przy odmowie proponuje inny wariant albo kolejny krok. Niepowodzenie potrafi przeanalizować i wskazać, co zrobiłby inaczej."}, {"kod": "R1.4", "ps": "Wyobraźmy sobie klienta, który głośno składa reklamację przy innych klientach. Co zostanie powiedziane i zrobione w pierwszych minutach?", "nazwa": "Negocjowanie i deeskalacja", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi prowadzić rozmowę z osobą zdenerwowaną albo będącą w sporze i doprowadzić ją do konkretnego ustalenia. Deeskalacja oznacza obniżenie napięcia w rozmowie do poziomu, na którym da się rozmawiać o rozwiązaniu. Kryterium ma znaczenie przy obsłudze reklamacji, w rozmowach z trudnymi klientami i przy sporach w zespole.", "p1": "Proszę opowiedzieć o rozmowie z osobą zdenerwowaną albo składającą reklamację. Jak przebiegła i czym się skończyła?", "p2": "Proszę opisać spór, w którym każda ze stron miała swoje racje, i sposób, w jaki doszło do porozumienia.", "pd": "Co dokładnie zostało powiedziane w pierwszych minutach tej rozmowy?", "o1": "Kandydat reaguje obroną, tłumaczeniem się albo podniesieniem tonu, albo natychmiast ustępuje we wszystkim. Rozmowa kończy się bez ustalenia albo ustaleniem niekorzystnym dla firmy.", "o2": "Kandydat uspokaja rozmowę i dochodzi do ustalenia w sporze o umiarkowanym napięciu, ale przy silnym konflikcie przekazuje sprawę komuś innemu.", "o3": "Kandydat najpierw obniża napięcie, na przykład wysłuchując drugiej strony i nazywając jej problem, potem oddziela to, czego strona się domaga, od tego, czego naprawdę potrzebuje, i doprowadza do konkretnego ustalenia także przy silnym konflikcie, bez rezygnacji z interesu firmy."}, {"kod": "R1.5", "ps": "Wyobraźmy sobie prezentację propozycji przed kilkoma osobami, z których jedna od początku ją podważa. Jak zostanie poprowadzona odpowiedź?", "nazwa": "Reprezentowanie", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi wystąpić przed grupą i obronić swoje stanowisko, gdy ktoś zadaje pytania albo je kwestionuje. Ma ono znaczenie w rolach, które prowadzą zebrania, prezentują ofertę albo reprezentują firmę na zewnątrz.", "p1": "Proszę opowiedzieć o wystąpieniu przed grupą, na przykład na zebraniu, prezentacji albo szkoleniu. Jak wyglądało przygotowanie i jak przebiegło wystąpienie?", "p2": "Proszę opisać sytuację, w której ktoś z grupy publicznie zakwestionował przedstawione stanowisko. Co zostało odpowiedziane?", "pd": "Co w tym wystąpieniu zostałoby dziś zrobione inaczej?", "o1": "Kandydat unika wystąpień i nie podaje przykładu albo, gdy ktoś zakwestionuje jego stanowisko, wycofuje je bez uzasadnienia.", "o2": "Kandydat przedstawia przygotowany materiał i odpowiada na pytania, które dało się przewidzieć, ale przy nieprzewidzianym sprzeciwie traci wątek albo odkłada odpowiedź.", "o3": "Kandydat przygotowuje wystąpienie pod konkretnych słuchaczy, na zakwestionowanie odpowiada rzeczowo i albo utrzymuje stanowisko z uzasadnieniem, albo zmienia je, podając powód zmiany."}, {"kod": "R2.1", "ps": "Wyobraźmy sobie współpracownika, który prosi o przejęcie swojego zadania, choć własnej pracy jest dużo. Co zostanie odpowiedziane?", "nazwa": "Sprawczość", "rodzaj": "dwubiegun", "co": "To kryterium sprawdza, w jakim stopniu kandydat przejmuje kierunek rozmowy i stawia granice innym. Kryterium jest dwubiegunowe, co oznacza, że ocena opisuje położenie kandydata na osi od niskiej do wysokiej sprawczości, a żadne z tych położeń nie jest samo w sobie lepsze. Wysoka sprawczość jest potrzebna kierownikowi i osobie, która negocjuje, natomiast w roli opartej na ścisłej współpracy wysoka sprawczość bywa źródłem konfliktów.", "p1": "Proszę opowiedzieć o sytuacji, w której ktoś oczekiwał czegoś, na co nie było zgody. Co zostało powiedziane?", "p2": "Proszę opisać spotkanie albo rozmowę, w której nikt nie prowadził, a sprawy się przeciągały. Co zostało zrobione?", "pd": "Jak zareagowała druga strona?", "o1": "Oznacza niską sprawczość. Kandydat dostosowuje się do oczekiwań innych, z trudem odmawia i czeka, aż ktoś inny pokieruje rozmową.", "o2": "Oznacza umiarkowaną sprawczość. Kandydat przejmuje kierunek rozmowy wtedy, gdy sytuacja tego wymaga, a odmawia z podaniem powodu.", "o3": "Oznacza wysoką sprawczość. Kandydat regularnie przejmuje prowadzenie rozmowy i stawia granice wprost, także wtedy, gdy nikt tego od niego nie oczekuje."}, {"kod": "R2.2", "ps": "Wyobraźmy sobie nową osobę w zespole, która wyraźnie sobie nie radzi, choć o nic nie prosi. Co zostanie zrobione?", "nazwa": "Wspólnotowość", "rodzaj": "dwubiegun", "co": "To kryterium sprawdza, w jakim stopniu kandydat dostraja się do drugiej osoby i dba o relację z nią. Kryterium jest dwubiegunowe, co oznacza, że ocena opisuje położenie kandydata na osi od niskiej do wysokiej wspólnotowości. Wysoka wspólnotowość jest potrzebna w pracy opartej na stałym zespole i w opiece nad klientem, natomiast w roli, która musi stawiać ludziom wymagania, zbyt wysoka wspólnotowość utrudnia egzekwowanie.", "p1": "Proszę opowiedzieć o sytuacji, w której współpracownik przechodził trudniejszy okres. Czy zostało to zauważone i co zostało zrobione?", "p2": "Proszę opisać sytuację, w której trzeba było wybrać między dobrą relacją z kimś a postawieniem mu wymagania.", "pd": "Jak ta relacja wyglądała później?", "o1": "Oznacza niską wspólnotowość. Kandydat skupia się na zadaniu, nie zauważa sygnałów wysyłanych przez innych, a w sytuacji wyboru stawia wymaganie bez względu na relację.", "o2": "Oznacza umiarkowaną wspólnotowość. Kandydat dba o relację, dopóki nie koliduje ona z zadaniem, a przy konflikcie potrafi postawić wymaganie.", "o3": "Oznacza wysoką wspólnotowość. Kandydat wcześnie zauważa, co dzieje się z innymi, dostraja się do nich, a w sytuacji wyboru stara się przede wszystkim zachować relację."}, {"kod": "R2.3", "ps": "Wyobraźmy sobie rozmowę, w której rzeczowe argumenty nie trafiają do rozmówcy. Co zostanie zmienione w sposobie rozmowy?", "nazwa": "Elastyczność interpersonalna", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi zmienić sposób postępowania z człowiekiem, gdy dotychczasowy przestaje działać, i czy robi to we właściwym momencie. Ma ono znaczenie w każdej roli, w której pracuje się z różnymi ludźmi, ponieważ ten sam sposób rozmowy nie działa na wszystkich.", "p1": "Proszę opowiedzieć o rozmowie, w której przyjęty sposób nie działał, ponieważ rozmówca nie reagował tak, jak się spodziewano. Co zostało zmienione?", "p2": "Proszę opisać dwie osoby, z którymi pracowało się w zupełnie różny sposób, i to, na czym ta różnica polegała.", "pd": "Po czym było widać, że trzeba zmienić podejście?", "o1": "Kandydat stosuje jeden sposób postępowania wobec wszystkich, a gdy ten sposób nie działa, powtarza go albo przypisuje winę rozmówcy.", "o2": "Kandydat zmienia podejście, ale późno, zwykle dopiero po wyraźnym niepowodzeniu albo po wskazówce kogoś innego.", "o3": "Kandydat wcześnie rozpoznaje sygnały, że podejście nie działa, zmienia je w trakcie rozmowy i potrafi opisać różne sposoby postępowania dopasowane do różnych osób."}]}, {"czesc": "MECHANIZM", "opis": "Kryteria z obszaru mechanizmu opisują, jak kandydat pracuje z zadaniem: jak planuje, jak korzysta z informacji, jak podejmuje decyzje, jak sprawdza własną pracę i jak radzi sobie z obciążeniem, nowym problemem i niepowodzeniem. Dwa z tych kryteriów, czyli sprawność rozumowania i dokładność wykonania, rozmowa mierzy tylko w przybliżeniu, dlatego jeśli są ważne dla roli, warto sprawdzić je także w zadaniu próbnym.", "items": [{"kod": "M1.1", "ps": "Wyobraźmy sobie początek dnia z pięcioma zadaniami, z których da się wykonać trzy. Jak zostanie ustalona kolejność?", "nazwa": "Planowanie i priorytetyzacja", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi ułożyć zadania w kolejności, oszacować potrzebny czas i odróżnić sprawy pilne od ważnych. Sprawa pilna to taka, która ma bliski termin, a sprawa ważna to taka, której niewykonanie ma poważny skutek; te dwie cechy nie zawsze występują razem.", "p1": "Proszę opowiedzieć o dniu albo tygodniu, w którym zadań było więcej, niż dało się wykonać. Jak została ustalona kolejność?", "p2": "Proszę opisać większe zadanie, które trzeba było rozłożyć na etapy. Jak powstał plan i jak został oszacowany czas?", "pd": "Co z tego planu zostało wykonane w terminie, a co nie, i z jakiego powodu?", "o1": "Kandydat wykonuje zadania w kolejności, w jakiej napływają, nie podaje kryterium ustalania kolejności, a czas szacuje ogólnie i często nie dotrzymuje terminów.", "o2": "Kandydat układa kolejność według terminów i potrafi zaplanować zadanie typowe, ale przy nieprzewidzianych zmianach nie koryguje planu.", "o3": "Kandydat ustala kolejność według jawnego kryterium, na przykład skutku niewykonania albo zależności między zadaniami, szacuje czas realistycznie, koryguje plan przy zmianach i wcześniej informuje o zagrożonym terminie."}, {"kod": "M1.2", "ps": "Wyobraźmy sobie, że potrzebna jest informacja o nowym przepisie albo produkcie, a nikt w firmie jej nie zna. Jak zostanie znaleziona i sprawdzona?", "nazwa": "Praca z informacją", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi samodzielnie znaleźć informację potrzebną do pracy, sprawdzić, czy jest wiarygodna, i uporządkować ją tak, żeby dało się z niej korzystać. Ma ono znaczenie w rolach, które pracują z przepisami, dokumentacją, cennikami albo specyfikacjami.", "p1": "Proszę opowiedzieć o sytuacji, w której trzeba było samodzielnie znaleźć informację potrzebną do pracy. Gdzie była szukana i jak zostało sprawdzone, że jest prawdziwa?", "p2": "Proszę opisać sytuację, w której informacja okazała się błędna albo nieaktualna. Jak zostało to wykryte?", "pd": "W jaki sposób ta informacja została uporządkowana albo przekazana dalej?", "o1": "Kandydat zdobywa informacje głównie przez pytanie innych albo korzysta z pierwszego znalezionego źródła i nie sprawdza jego wiarygodności.", "o2": "Kandydat znajduje informację i sprawdza ją w typowych, znanych mu źródłach, ale nie porównuje źródeł między sobą.", "o3": "Kandydat porównuje kilka źródeł, ocenia ich wiarygodność i porządkuje zebrany materiał w taki sposób, że mogą z niego korzystać także inne osoby."}, {"kod": "M1.3", "ps": "Wyobraźmy sobie wybór między dwoma dostawcami: jednym tańszym, drugim pewniejszym. Jak zostanie podjęta decyzja i jak zostanie uzasadniona?", "nazwa": "Formułowanie i uzasadnianie decyzji", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat potrafi nazwać kryterium, według którego wybrał rozwiązanie, i obronić swój wybór. Kryterium nie ocenia trafności decyzji, ponieważ w rozmowie nie da się jej sprawdzić, tylko to, czy decyzja ma jawne uzasadnienie.", "p1": "Proszę opowiedzieć o decyzji w pracy, przy której było kilka możliwości. Co przesądziło o wyborze?", "p2": "Proszę opisać sytuację, w której ktoś zakwestionował podjętą decyzję. Jak została uzasadniona?", "pd": "Co musiałoby się zmienić, żeby wybór był inny?", "o1": "Kandydat nie nazywa kryterium wyboru i tłumaczy decyzję przeczuciem albo tym, że tak wyszło.", "o2": "Kandydat podaje kryterium wyboru, ale jest ono jedno i ogólne, a kandydat nie porównuje wybranego rozwiązania z innymi możliwościami.", "o3": "Kandydat nazywa kilka kryteriów i wskazuje, które było najważniejsze, porównuje z nimi rozważane możliwości i potrafi powiedzieć, w jakich warunkach wybrałby inaczej."}, {"kod": "M1.4", "ps": "Wyobraźmy sobie pracę gotową do oddania pięć minut przed terminem. Co zostanie zrobione w tych pięciu minutach?", "nazwa": "Autokontrola jakości", "rodzaj": "poziom", "co": "To kryterium sprawdza, czy kandydat sprawdza własną pracę przed jej oddaniem i wychwytuje w niej usterki. Ma ono znaczenie wszędzie tam, gdzie błąd jest do naprawienia tylko wtedy, gdy zostanie wykryty, zanim praca trafi do klienta albo do kolejnej osoby.", "p1": "Proszę opowiedzieć, jak wygląda sprawdzanie własnej pracy przed jej oddaniem, na ostatnim konkretnym przykładzie.", "p2": "Proszę opisać błąd we własnej pracy, który został wykryty przed przekazaniem jej dalej. W jaki sposób udało się go wykryć?", "pd": "A błąd, który wykrył ktoś inny: co po nim zostało zmienione w sposobie pracy?", "o1": "Kandydat sprawdza pracę pobieżnie albo wcale, a o błędach w swoich przykładach dowiaduje się od innych.", "o2": "Kandydat sprawdza pracę według stałego nawyku i wychwytuje błędy w zadaniach typowych, ale po błędzie wykrytym przez innych nie zmienia sposobu sprawdzania.", "o3": "Kandydat ma określony sposób sprawdzania pracy, dopasowany do tego, gdzie najłatwiej o błąd, wychwytuje własne usterki, a po błędzie zmienia sposób pracy tak, żeby się nie powtórzył."}, {"kod  if(['14','15','16','17','18'].includes(p.key))return 'Z2_'+p.key;

 let h=`<h1>Przygotowanie narzędzi</h1><p class="lead">Narzędzia, które wybrałeś, dzielą się na gotowe i do przygotowania. Gotowe wydrukujesz w następnym kroku. Narzędzia do przygotowania układasz sam, bo tylko ty znasz pracę na tym stanowisku; kreator prowadzi cię przez decyzje, które trzeba podjąć, żeby wynik dało się porównać między kandydatami.</p>`;

 h+=`<h2>Gotowe</h2><div class="card">${got.map(t=>`<p style="margin:4px 0"><b>${T[t].nm}.</b> ${t==='RB'||t==='RS'?'Scenariusz z pytaniami i opisami ocen z banku pytań.':t==='TEL'?'Scenariusz rozmowy z pytaniami o warunki formalne i dostępność.':t==='REF'?'Pytania do poprzedniego pracodawcy o wybrane kryteria.':t==='DP'?'Karta obserwacji z wybranymi kryteriami i opisami ocen.':t==='DOK'?'Lista dokumentów do sprawdzenia jest na karcie stanowiska.':'Skierowanie wystawiasz według zwykłej procedury.'}</p>`).join('')||'<p class="hint">Brak.</p>'}</div>`;
 if(u.DP)h+=`<div class="warn">Płatny dzień próbny wymaga umowy na ten dzień. Bez umowy praca kandydata na rzecz firmy może zostać uznana za świadczenie pracy bez podstawy prawnej. W sprawach wątpliwych zapytaj prawnika.</div>`;
 h+=`<h2>Do przygotowania</h2>`;
 const ks=Object.keys(P);
 if(!ks.length)h+='<div class="card"><p class="hint" style="margin:0">Żadne z wybranych narzędzi nie wymaga przygotowania.</p></div>';
 ks.forEach(k=>{const t=k.split('_')[0],p=pr(k),lista=P[k],ok=projGotowy(k,lista);
  h+=`<div class="trial"><h3>${nazwaProj(k)}</h3><p class="hint">${T[t].op}</p>
  <p><b>Sprawdza:</b> ${lista.map(q=>esc(q.nm)).join('; ')}.</p>
  ${k.startsWith('Z2_')?`<div class="info">${Z2WAR[k.slice(3)]||''}</div>`:''}
  ${POLA[t].map(([f,l,ex],i)=>`<label class="f">${i+1}. ${l}</label><textarea oninput="setPF('${k}','${f}',this.value)">${esc(p[f])}</textarea><div class="ex"><b>Przykład:</b> ${t==='Z2'&&f==='opis'?(Z2WAR[k.slice(3)]||ex):ex}</div>`).join('')}
  <label class="f">${POLA[t].length+1}. Jak ocenisz każde wymaganie</label><p class="hint">Opisz wykonanie na każdą ocenę, zanim zobaczysz pierwszego kandydata. Przy kryteriach zachowań kreator wpisał opisy z banku pytań; dopasuj je do tego zadania.</p>
  ${lista.map(q=>{const a=kotwiceDomyslne(k,q);return `<div class="anb"><div class="nm">${esc(q.nm)}</div>
   ${q.rodz==='zad'?`<div style="max-width:320px;margin:4px 0 8px">${scale(q.key,S.proj['wym'+q.key]||2,'setWT',[[2,'wymagane co najmniej 2'],[3,'wymagane 3']])}</div>`:`<p class="hint">${celTxt(q.c,q.key)}</p>`}
   <div class="anch">${[1,2,3].map(o=>`<div><label class="f" style="margin-top:4px">Ocena ${o}</label><textarea oninput="setA('${k}','${q.key}','o${o}',this.value)">${esc(a['o'+o])}</textarea></div>`).join('')}</div></div>`}).join('')}
  <label class="f">${POLA[t].length+2}. Limit czasu w minutach</label><input type="number" min="5" max="480" style="max-width:140px" value="${esc(p.limit)}" oninput="setPF('${k}','limit',this.value)">
  ${t==='P1'?`<label class="f">Czy efekt zadania zostanie wykorzystany w działalności firmy, na przykład podany klientowi, sprzedany albo włączony do projektu?</label><div style="max-width:330px">${scale(k,p.kom,'setKom',TNC)}</div>
   ${p.kom==='tak'?'<div class="alarm">Wykonanie pracy na rzecz firmy bez umowy może zostać uznane za świadczenie pracy, a kandydaci odbierają je jako pracę za darmo. Zmień zadanie tak, żeby jego efekt nie był wykorzystany, albo zawrzyj z kandydatem umowę na ten czas. W sprawach wątpliwych zapytaj prawnika.</div>':''}
   ${p.kom==='czesc'?'<div class="warn">Jeśli część efektu zadania zostanie wykorzystana w działalności firmy, ta część może zostać uznana za świadczenie pracy bez umowy. Oddziel ją od zadania albo zawrzyj z kandydatem umowę na ten czas.</div>':''}`:''}
  ${ok?'':'<div class="warn">To narzędzie nie trafi do postępowania, dopóki nie wypełnisz wszystkich pól i opisów ocen.</div>'}</div>`});
 return h+`<button class="btn sec" onclick="render()">Sprawdź kompletność</button>`+nav(5,7,'Pokaż przebieg postępowania')}
function setKom(k,v){pr(k).kom=v;save();render()}

/* ---------- KROK 7: POSTĘPOWANIE ---------- */
function gotoweP(){const P=projekty(),o={};Object.keys(P).forEach(k=>{if(projGotowy(k,P[k]))o[k]=P[k]});return o}
function etapy(){const u=uzyte(),P=projekty(),G=gotoweP(),r=rodzina(),st=[];
 const nm=l=>l.map(p=>p.nm.toLowerCase().replace(/\.$/,'')).join('; ');
 if(u.DOK)st.push({n:'Analiza dokumentów',cz:0,tm:'przed zaproszeniem, około 5 minut na kandydata, bez jego udziału',co:'Sprawdzasz w dokumentach: '+nm(u.DOK)+'.',wy:'Wiesz, którzy kandydaci mają wymagane dokumenty. Kto nie spełnia warunku wymaganego, nie przechodzi dalej. Ten etap nic nie kosztuje kandydata ani ciebie, dlatego jest pierwszy.'});
 if(u.TEL)st.push({n:'Rozmowa telefoniczna wstępna',cz:15,tm:'około 15 minut',co:'Pytasz o: '+nm(u.TEL)+'.',wy:'Wiesz, kto może pracować w wymaganym trybie i miejscu. Zapraszasz na spotkanie tylko te osoby.'});
 const rb=(u.RB||[]).concat(u.RS||[]);
 if(rb.length){const c=10+5*rb.length;st.push({n:'Rozmowa według scenariusza',cz:c,tm:'około '+c+' minut',co:'Zadajesz wszystkim kandydatom te same pytania w tej samej kolejności, zapisujesz odpowiedzi, a oceny wystawiasz zaraz po rozmowie. Kryteria: '+nm(rb)+'.',wy:'Masz ocenę od 1 do 3 w każdym z tych kryteriów. Kandydat z oceną 1 w kryterium kluczowym nie spełnia wymagań stanowiska.'})}
 Object.keys(G).sort((a,b)=>T[a.split('_')[0]].etap-T[b.split('_')[0]].etap).forEach(k=>{const p=pr(k),c=parseInt(p.limit,10)||0;
  st.push({n:nazwaProj(k),cz:c,tm:'około '+c+' minut',co:kropka(p.opis||p.pyt||'Według przygotowanej instrukcji')+' Sprawdza: '+nm(G[k])+'.',wy:'Masz ocenę od 1 do 3 w każdym sprawdzanym wymaganiu, według opisów, które przygotowałeś.'})});
 if(u.REF)st.push({n:'Rozmowa z poprzednim pracodawcą',cz:0,tm:'około 15 minut na kandydata, bez jego udziału, tylko z kandydatami branymi pod uwagę na końcu',co:'Za zgodą kandydata pytasz o: '+nm(u.REF)+'.',wy:'Masz potwierdzenie albo zaprzeczenie ocen z wcześniejszych etapów w oczach osoby, która widziała kandydata w pracy.'});
 if(u.DP)st.push({n:'Płatny dzień próbny',cz:0,tm:'jeden dzień, na podstawie umowy, z jednym lub dwoma najlepszymi kandydatami',co:'Obserwujesz: '+nm(u.DP)+'.',wy:'Masz ocenę zachowań w rzeczywistych warunkach pracy, które wcześniej znałeś tylko z opowieści kandydata.'});
 st.push({n:'Porównanie kandydatów i decyzja',cz:0,tm:'po ostatnim kandydacie, około 15 minut',co:'Wpisujesz oceny wszystkich kandydatów w kroku „Kandydaci”. Kreator odrzuca tych, którzy nie spełniają warunków wymaganych, a pozostałych porządkuje według tego, jak daleko ich oceny odbiegają od wymagań.',wy:'Masz kolejność kandydatów i dla każdego listę różnic względem wymagań, w tym sprawy do sprawdzenia w okresie próbnym.'});
 if(u.LEK)st.push({n:'Badanie lekarskie',cz:0,tm:'przed zawarciem umowy',co:'Kierujesz wybranego kandydata do lekarza medycyny pracy.',wy:'Masz orzeczenie o braku przeciwwskazań do pracy na tym stanowisku.'});
 return st}
function k7(){const r=rodzina(),st=etapy(),tot=st.reduce((a,s)=>a+s.cz,0),P=projekty(),G=gotoweP(),u=uzyte();
 let h=`<h1>Przebieg postępowania</h1><p class="lead">Etapy są ułożone od najtańszego do najbardziej pracochłonnego, dlatego możesz zakończyć postępowanie z kandydatem na każdym z nich. Przy każdym etapie podany jest czas i wynik, który masz po jego zakończeniu.</p>
 <div class="tot"><div><b>${tot} min</b><span>spotkań z jednym kandydatem</span></div><div><b>${st.length}</b><span>etapów</span></div></div>
 ${tot>PROG[r]?`<div class="warn">Spotkania z jednym kandydatem trwają dłużej niż ${PROG[r]} minut. Możesz wyłączyć jedno z kryteriów w profilu albo skrócić limit czasu któregoś zadania.</div>`:''}
 ${Object.keys(P).length>Object.keys(G).length?'<div class="warn">Część narzędzi do przygotowania nie jest kompletna, dlatego nie ma ich w postępowaniu. Uzupełnij je w kroku „Przygotowanie”.</div>':''}
 <div class="card">${st.map((s,i)=>`<div class="stage"><div class="n">${i+1}</div><div><h3>${s.n}</h3><div class="tm">${s.tm}</div><p>${s.co}</p><p><b>Wynik etapu:</b> ${s.wy}</p></div></div>`).join('')}</div>
 <h2>Dokumenty do wydruku</h2><div class="nav" style="justify-content:flex-start;flex-wrap:wrap">
 <button class="btn hon" onclick="drukKarta()">Karta stanowiska</button>
 ${u.TEL?'<button class="btn hon" onclick="drukTel()">Rozmowa telefoniczna</button>':''}
 ${u.RB||u.RS?'<button class="btn hon" onclick="drukRozmowa()">Scenariusz rozmowy</button>':''}
 ${Object.keys(G).map(k=>`<button class="btn hon" onclick="drukProj('${k}')">${nazwaProj(k).split(':')[0]}</button>`).join('')}
 ${u.REF?'<button class="btn hon" onclick="drukRef()">Rozmowa z poprzednim pracodawcą</button>':''}
 ${u.DP?'<button class="btn hon" onclick="drukDP()">Dzień próbny</button>':''}</div>
 <p class="hint">Scenariusze i karty obserwacji drukujesz osobno dla każdego kandydata.</p>`;
 return h+nav(6,8,'Przejdź do kandydatów')}

/* ---------- KROK 8: KANDYDACI ---------- */
function nowyK(){S.kand.push({imie:'',form:'',oc:{},mile:{}});save();render()}
function setKF(i,v){S.kand[i].form=v;save();render()}
function togMile(i,k){const m=S.kand[i].mile=S.kand[i].mile||{};m[k]=!m[k];save();render()}
function setOc(i,k,v){const o=S.kand[i].oc;o[k]=o[k]===v?undefined:v;save();render()}
function mini(val,fn){return `<div class="mini">${[1,2,3].map(v=>`<button class="${val===v?'on':''}" onclick="${fn},${v})">${v}</button>`).join('')}</div>`}
function ocenione(){const G=gotoweP(),ok=new Set();Object.values(G).forEach(l=>l.forEach(p=>ok.add(p.key)));
 return pozycje().filter(p=>{const t=narz(p);return t&&(!T[t].proj||ok.has(p.key))})}
function ocen(k){const ps=ocenione();let luka=0,roz=[],brak=0,kl=0;
 ps.forEach(p=>{const s=k.oc[p.key];if(s==null){brak++;return}const c=p.c,wg=p.pri===1?2:1;
  const d=c.t==='pol'?Math.abs(s-c.w):Math.max(0,c.w-s);
  if(d>0){luka+=d*wg;roz.push(p.nm+' (ocena '+s+', '+(c.t==='pol'?'dopasowana '+c.w:'wymagana '+c.w)+')');if(p.pri===1&&c.t!=='pol')kl++}});
 const fl=ps.some(p=>p.rodz==='kryt'&&J[p.key][2]==='N')&&k.oc['06']===1;
 const ml=ogrMile().filter(x=>(k.mile||{})[x]).map(x=>OG(x)[2]);
 return {luka,roz,brak,kl,fl,ml}}
function k8(){const ps=ocenione(),nap=ps.some(p=>p.rodz==='kryt'&&J[p.key][2]==='N');
 let h=`<h1>Kandydaci</h1><p class="lead">Wpisz oceny każdego kandydata zaraz po jego rozmowie i zadaniach, zanim zaczniesz porównywać kandydatów ze sobą. Kliknięcie tej samej oceny drugi raz ją usuwa.</p>`;
 S.kand.forEach((k,i)=>{h+=`<div class="card"><div class="row"><input type="text" value="${esc(k.imie)}" placeholder="imię i nazwisko albo oznaczenie kandydata" oninput="S.kand[${i}].imie=this.value;save()"><button class="x" title="Usuń kandydata" onclick="S.kand.splice(${i},1);save();render()">×</button></div>
  ${ogrWym().length?`<div class="q"><div class="t">Spełnia wszystkie warunki wymagane</div><div class="sc two">${['tak','nie'].map(v=>`<button class="${k.form===v?'on':''}" onclick="setKF(${i},'${v}')">${v}</button>`).join('')}</div></div>`:''}
  ${ogrMile().length?`<div class="q"><div class="t">Warunki mile widziane, które kandydat spełnia</div><div>${ogrMile().map(x=>`<label class="chk"><input type="checkbox" ${(k.mile||{})[x]?'checked':''} onchange="togMile(${i},'${x}')">${OG(x)[2].split(',')[0]}</label>`).join('')}</div></div>`:''}
  <div class="scwrap"><table class="cmp"><tr><th>Wymaganie</th><th>Narzędzie</th><th>Wymaganie</th><th style="width:120px">Ocena</th></tr>
  ${ps.map(p=>`<tr><td>${esc(p.nm)}${p.pri===1?'<span class="pill p1">kluczowe</span>':''}</td><td style="font-size:13px">${T[narz(p)].nm}</td><td style="font-size:13px">${p.rodz==='kryt'?celTxt(p.c,p.key):'Wymagana ocena '+(p.c.w===3?'3.':'co najmniej 2.')}</td><td>${mini(k.oc[p.key],`setOc(${i},'${p.key}'`)}</td></tr>`).join('')}
  ${nap?`<tr><td>Wyrazistość napędu</td><td style="font-size:13px">ocena po rozmowie</td><td style="font-size:13px">Sygnał; ocena 1 oznacza potrzebę dodatkowego sprawdzenia.</td><td>${mini(k.oc['06'],`setOc(${i},'06'`)}</td></tr>`:''}
  </table></div></div>`});
 h+=`<button class="btn sec" onclick="nowyK()">Dodaj kandydata</button>`;
 if(S.kand.length){const L=S.kand.map(k=>Object.assign({k},ocen(k)));
  const odp=L.filter(x=>x.k.form==='nie'),dal=L.filter(x=>x.k.form!=='nie').sort((a,b)=>a.kl-b.kl||a.luka-b.luka);
  h+=`<h2>Porównanie</h2><p class="lead">Kandydaci są uporządkowani najpierw według liczby niespełnionych wymagań kluczowych, a potem według łącznej odległości ocen od wymagań. Wymagania kluczowe liczą się podwójnie. Przy kryteriach dopasowania liczy się odległość od położenia, którego wymaga stanowisko, a nie wysokość oceny.</p>`;
  dal.forEach((x,n)=>{h+=`<div class="rank"><div class="pos">${n+1}</div><div><b>${esc(x.k.imie)||'Kandydat bez nazwy'}</b>
   <p style="margin:4px 0 0;font-size:14.5px">${x.kl?`Niespełnione wymagania kluczowe: ${x.kl}. `:''}Odległość od wymagań: ${x.luka}.${x.roz.length?' Różnice: '+x.roz.join('; ')+'.':' Oceny spełniają wymagania stanowiska.'}</p>
   ${ogrMile().length?`<p class="hint">Warunki mile widziane: ${x.ml.length?'spełnia '+x.ml.length+' z '+ogrMile().length:'nie spełnia żadnego'}.</p>`:''}
   ${x.fl?'<p class="hint">Napęd rozmyty: sprawdź go w rozmowie z poprzednim pracodawcą albo w okresie próbnym.</p>':''}
   ${x.brak?`<p class="hint">Brakuje ${x.brak} ocen, więc porównanie tego kandydata jest niepełne.</p>`:''}${x.k.form===''&&ogrWym().length?'<p class="hint">Nie zaznaczono, czy kandydat spełnia warunki wymagane.</p>':''}</div></div>`});
  odp.forEach(x=>{h+=`<div class="rank out"><div class="pos">–</div><div><b>${esc(x.k.imie)||'Kandydat bez nazwy'}</b><p style="margin:4px 0 0;font-size:14.5px">Nie spełnia warunków wymaganych, dlatego nie bierze udziału w porównaniu.</p></div></div>`});
  h+=`<div class="nav" style="justify-content:flex-start"><button class="btn hon" onclick="drukPor()">Drukuj porównanie</button></div>`}
 return h+nav(7,0)}

/* ---------- WYDRUKI ---------- */
function druk(h){document.getElementById('druk').innerHTML=h+'<div class="ft">PROFILENS · ZMIANOLOGICA · dr Marcin Żółtak</div>';setTimeout(()=>window.print(),120)}
function nag(t){return `<h1>${t}</h1><div class="sub">${esc(S.nazwa||'Stanowisko')}</div>`}
const METRYKA=`<p>Kandydat: ______________________________ &nbsp; Data: ____________ &nbsp; Prowadzący: ______________________</p>`;
const OCENA=`<p style="margin-top:4pt">Ocena: <span class="box">1</span><span class="box">2</span><span class="box">3</span></p>`;
function drukKarta(){const R=roz(),st=etapy();
 druk(nag('Karta stanowiska')+(S.cel?`<h2>Cel stanowiska</h2><p>${esc(S.cel)}</p>`:'')+
 `<h2>Zadania stanowiska</h2><ol>${zadania().map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
 <h2>Typ stanowiska</h2><p><b>${typ().charAt(0).toUpperCase()+typ().slice(1)}.</b> ${TYP_OP[typ()]}</p>
 <p>${['W','P','C'].filter(k=>R[k]>0).map(k=>'Rozliczanie '+ROZ_NM[k]+': '+PRZEDZ[R[k]]).join('. ')}.</p>
 <h2>Warunki formalne</h2>${ogrWym().length||ogrMile().length?'<ul>'+ogrWym().concat(ogrMile()).map(k=>`<li>${OG(k)[2]} (${S.ogr[k]==='wym'?'wymagane':'mile widziane'})</li>`).join('')+'</ul>':'<p>Brak.</p>'}
 <h2>Wymagania i narzędzia</h2><table><tr><th>Wymaganie</th><th>Poziom</th><th>Narzędzie</th></tr>${pozycje().map(p=>`<tr><td>${esc(p.nm)}${p.pri===1?' (kluczowe)':''}</td><td>${p.rodz==='kryt'?celTxt(p.c,p.key):'wymagana ocena '+(p.c.w===3?'3':'co najmniej 2')}</td><td>${narz(p)?T[narz(p)].nm:'—'}</td></tr>`).join('')}</table>
 <h2>Przebieg postępowania</h2><ol>${st.map(s=>`<li><b>${s.n}</b> (${s.tm}). ${s.wy}</li>`).join('')}</ol>`)}
function drukTel(){const l=uzyte().TEL||[];
 druk(nag('Rozmowa telefoniczna wstępna')+METRYKA+`<h2>Przebieg</h2><p>Przedstaw się, powiedz, na jakie stanowisko prowadzisz rekrutację i że rozmowa potrwa około 15 minut.</p>
 ${l.map(p=>`<div class="cr"><h3>${esc(p.nm)} (${S.ogr[p.key]==='wym'?'wymagane':'mile widziane'})</h3><p class="a">${OG(p.key)[3]}</p><p>Spełnia: <span class="box">tak</span> <span class="box">nie</span></p></div>`).join('')}
 <div class="cr"><h3>Oczekiwania kandydata</h3><p>Co jest najważniejsze przy wyborze nowej pracy? Od kiedy możliwe jest rozpoczęcie pracy?</p><div class="notes"></div></div>
 <p>Na koniec powiedz, kiedy i w jaki sposób kandydat otrzyma odpowiedź.</p>`)}
function drukRozmowa(){const u=uzyte(),l=(u.RB||[]).map(p=>[p,'RB']).concat((u.RS||[]).map(p=>[p,'RS'])).sort((a,b)=>OBO[J[a[0].key][2]]-OBO[J[b[0].key][2]]),
 obsz={N:'Czego kandydat chce od pracy',R:'Praca z ludźmi',M:'Sposób pracy'};let last='',h=nag('Scenariusz rozmowy')+METRYKA+
 `<h2>Zasady</h2><p>Zadaj pytania w podanej kolejności. Gdy odpowiedź jest ogólna, poproś o jeden konkretny przykład i zadaj pytanie dodatkowe. W trakcie zapisuj to, co kandydat mówi. Oceny wystaw zaraz po rozmowie, porównując notatki z opisami ocen, zanim zaczniesz rozmowę z kolejnym kandydatem.</p>
 <h2>Otwarcie (około 5 minut)</h2><p>Przedstaw firmę, stanowisko i przebieg spotkania.</p>`;
 l.forEach(([p,t])=>{const b=B[p.key],a=J[p.key][2];if(a!==last){if(last==='N')h+=flaga();h+=`<h2>${obsz[a]}</h2>`;last=a}
  const sit=t==='RS'||S.moz.c==='czesc';
  h+=`<div class="cr"><h3>${b.nazwa}</h3><p class="a"><b>Wymaganie:</b> ${celTxt(p.c,p.key)}</p>
  ${t==='RB'?`<p><b>1.</b> ${b.p1}</p><p><b>2.</b> ${b.p2}</p><p><b>Dodatkowe:</b> ${b.pd}</p>`:''}
  ${sit?`<p><b>${t==='RB'?'Sytuacyjne, gdy kandydat nie ma doświadczenia:':'Pytanie:'}</b> ${b.ps}</p>`:''}
  <div class="notes"></div><p class="a"><b>1</b> — ${b.o1}</p><p class="a"><b>2</b> — ${b.o2}</p><p class="a"><b>3</b> — ${b.o3}</p>${OCENA}</div>`});
 if(last==='N')h+=flaga();
 druk(h+`<h2>Zakończenie (około 5 minut)</h2><p>Zapytaj, czy kandydat ma pytania, i powiedz, kiedy i w jaki sposób otrzyma odpowiedź.</p>`)}
function flaga(){const b=B['06'];return `<div class="cr"><h3>Wyrazistość napędu (bez osobnych pytań)</h3><p class="a">Ocenia się na podstawie odpowiedzi na pytania o to, czego kandydat chce od pracy.</p>
 <p class="a"><b>1</b> — ${b.o1}</p><p class="a"><b>2</b> — ${b.o2}</p><p class="a"><b>3</b> — ${b.o3}</p>${OCENA}</div>`}
function drukProj(k){const t=k.split('_')[0],p=pr(k),l=projekty()[k]||[];
 const inst=POLA[t].filter(([f])=>!['obs','klucz'].includes(f)&&!(t==='Z2'&&f==='mat'));
 druk(nag(nazwaProj(k))+`<h2>Instrukcja dla kandydata</h2>${inst.map(([f,lb])=>`<p><b>${lb}:</b> ${esc(p[f])}</p>`).join('')}<p><b>Czas:</b> ${esc(p.limit)} minut.</p>
